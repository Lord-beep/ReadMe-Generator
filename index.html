<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadMeGen - Gerador Automático</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- Cabeçalho -->
        <div class="form-group" style="text-align: center;">
            <h1 class="title">ReadMeGen UI</h1>
            <p class="subtitle">
                Gerador automático de documentação para projetos GitHub
            </p>
        </div>


        <!-- Repositório -->
        <div>

            <div class="form-group">

                <label class="label">
                    Repositório do GitHub
                </label>

                <input
                    type="text"
                    id="repoInput"
                    class="input-field"
                    placeholder="Ex: Lord-beep/MultiPrint ou URL completo"
                >

            </div>


            <button
                id="btnGerar"
                class="btn-submit"
            >
                Gerar Ficheiros de Documentação
            </button>

        </div>


        <!-- Estado -->
        <div
            id="statusContainer"
            class="status-box hidden"
        >

            <p
                id="statusText"
                class="status-text"
            >
                A carregar...
            </p>

        </div>


        <!-- Resultado -->
        <div
            id="resultContainer"
            class="hidden"
        >

            <div class="success-box">

                <h3 class="success-title">
                    ✅ Documentação Criada!
                </h3>

                <p class="success-desc">
                    Os ficheiros README.md e descricao_curta.txt
                    foram gerados com sucesso.
                </p>

            </div>


            <div
                class="form-group"
                style="margin-top: 16px;"
            >

                <label class="label">
                    Resumo Comercial do Projeto
                </label>

                <textarea
                    id="outputDescricao"
                    readonly
                    class="textarea-field"
                ></textarea>

            </div>

        </div>

    </div>


    <script>

        const { ipcRenderer } = require('electron');


        // ==================================================
        // BOTÃO GERAR
        // ==================================================

        document
            .getElementById('btnGerar')
            .addEventListener('click', async () => {

                const repoInput =
                    document
                        .getElementById('repoInput')
                        .value
                        .trim();


                const statusContainer =
                    document.getElementById(
                        'statusContainer'
                    );

                const statusText =
                    document.getElementById(
                        'statusText'
                    );

                const resultContainer =
                    document.getElementById(
                        'resultContainer'
                    );

                const outputDescricao =
                    document.getElementById(
                        'outputDescricao'
                    );

                const btnGerar =
                    document.getElementById(
                        'btnGerar'
                    );


                // ==========================================
                // VALIDAR INPUT
                // ==========================================

                if (!repoInput) {

                    alert(
                        'Por favor, introduza o link ou identificador do repositório.'
                    );

                    return;
                }


                // ==========================================
                // LIMPAR URL
                // ==========================================

                let repoPath =
                    repoInput
                        .replace(
                            /^https?:\/\/(www\.)?github\.com\//i,
                            ''
                        )
                        .replace(
                            /\.git$/i,
                            ''
                        )
                        .trim();


                // ==========================================
                // VALIDAR FORMATO
                // ==========================================

                if (
                    !repoPath.includes('/') ||
                    repoPath.split('/').length < 2
                ) {

                    statusContainer.classList.remove(
                        'hidden'
                    );

                    statusText.innerText =
                        '❌ Formato inválido. Utilize utilizador/repositorio.';

                    statusText.style.color =
                        '#f87171';

                    return;
                }


                // ==========================================
                // GARANTIR APENAS UTILIZADOR/REPOSITÓRIO
                // ==========================================

                const partes =
                    repoPath.split('/');

                repoPath =
                    `${partes[0]}/${partes[1]}`;


                // ==========================================
                // ESTADO
                // ==========================================

                statusContainer.classList.remove(
                    'hidden'
                );

                resultContainer.classList.add(
                    'hidden'
                );

                btnGerar.disabled = true;

                btnGerar.style.opacity = '0.6';

                statusText.style.color =
                    '#818cf8';

                statusText.innerText =
                    `🌐 A obter código de https://github.com/${repoPath}...`;


                try {

                    // ======================================
                    // 1. OBTER CÓDIGO DO GITHUB
                    // ======================================

                    const codigoDoProjeto =
                        await ipcRenderer.invoke(
                            'executar-geracao',
                            {
                                repoPath
                            }
                        );


                    if (!codigoDoProjeto) {

                        throw new Error(
                            'Não foi possível obter o código do projeto.'
                        );

                    }


                    // ======================================
                    // 2. ENVIAR CÓDIGO PARA O SERVIDOR
                    // ======================================

                    statusText.innerText =
                        '🤖 A enviar o projeto para o servidor de IA...';


                    const resposta =
                        await fetch(
                            'http://localhost:3000/gerar',
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                body: JSON.stringify({
                                    codigo:
                                        codigoDoProjeto
                                })
                            }
                        );


                    // ======================================
                    // VERIFICAR RESPOSTA
                    // ======================================

                    if (!resposta.ok) {

                        let erroServidor =
                            'Erro no servidor.';

                        try {

                            const erro =
                                await resposta.json();

                            if (erro.error) {
                                erroServidor =
                                    erro.error;
                            }

                        } catch (_) {}

                        throw new Error(
                            erroServidor
                        );

                    }


                    const dados =
                        await resposta.json();


                    if (!dados.resultado) {

                        throw new Error(
                            'O servidor não devolveu nenhum resultado.'
                        );

                    }


                    // ======================================
                    // 3. PROCESSAR RESPOSTA DO GEMINI
                    // ======================================

                    statusText.innerText =
                        '📄 A preparar os ficheiros...';


                    const textoGerado =
                        dados.resultado;


                    const descricaoMatch =
                        textoGerado.match(
                            /\[DESCRICAO_CURTA\]([\s\S]*?)\[\/DESCRICAO_CURTA\]/
                        );


                    const readmeMatch =
                        textoGerado.match(
                            /\[README_MARKDOWN\]([\s\S]*?)\[\/README_MARKDOWN\]/
                        );


                    const conteudoDescricao =
                        descricaoMatch &&
                        descricaoMatch[1]
                            ? descricaoMatch[1].trim()
                            : '';


                    const conteudoReadme =
                        readmeMatch &&
                        readmeMatch[1]
                            ? readmeMatch[1].trim()
                            : '';


                    if (!conteudoReadme) {

                        throw new Error(
                            'A IA não devolveu um README válido.'
                        );

                    }


                    // ======================================
                    // 4. GRAVAR FICHEIROS
                    // ======================================

                    await ipcRenderer.invoke(
                        'gravar-resultados',
                        {
                            readme:
                                conteudoReadme,

                            staticDesc:
                                conteudoDescricao
                        }
                    );


                    // ======================================
                    // 5. MOSTRAR RESULTADO
                    // ======================================

                    outputDescricao.value =
                        conteudoDescricao;


                    statusContainer.classList.add(
                        'hidden'
                    );

                    resultContainer.classList.remove(
                        'hidden'
                    );


                } catch (erro) {

                    console.error(
                        'Erro:',
                        erro
                    );

                    statusContainer.classList.remove(
                        'hidden'
                    );

                    statusText.innerText =
                        `❌ Erro: ${erro.message}`;

                    statusText.style.color =
                        '#f87171';


                } finally {

                    btnGerar.disabled = false;

                    btnGerar.style.opacity = '1';

                }

            });

    </script>

</body>
</html>
